[package]
name = "rikkahub-mermaid"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.merman]
tag = "v0.8.0-alpha.6"
revision = "d529f858ea3d337a1bdc8fe12e44e1403ededf2e"

[lib]
name = "rikkahub_mermaid"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Use the upstream Rust crate defaults (complete-svg, including math).
merman = { path = "../merman/crates/merman" }
serde_json = "1"

# Match the pinned upstream native-distribution profile, including unwind at the C boundary.
[profile.native-distribution]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.native-distribution.build-override]
strip = "none"
