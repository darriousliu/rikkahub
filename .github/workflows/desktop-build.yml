name: Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@v4
      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - name: Build optimized installer
        shell: bash
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS --console=plain
      - name: Archive installer
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-${{ matrix.platform }}
          path: |
            desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            desktopApp/build/compose/binaries/main-release/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
      - name: Archive obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-${{ matrix.platform }}-mapping
          path: desktopApp/build/reports/proguard/
          if-no-files-found: error
